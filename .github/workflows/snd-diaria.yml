name: SND - caracteristicas e agenda de debentures

on:
  schedule:
    # 06:30 em Brasilia (09:30 UTC), seg-sex
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      inspecionar:
        description: "sim = so descreve a fonte (status, colunas, 3 registros), nao grava"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: push-main, cancel-in-progress: false }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pytest

      - name: Testes
        run: python -m pytest -q tests/test_snd.py

      - name: Rodar coleta
        env:
          IN_INSPECIONAR: ${{ inputs.inspecionar }}
        run: |
          if [ "$IN_INSPECIONAR" = "sim" ]; then
            python snd.py --inspecionar >> "$GITHUB_STEP_SUMMARY"
          else
            python snd.py
          fi

      - name: Commit e push
        if: ${{ inputs.inspecionar != 'sim' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/snd/
          if git diff --staged --quiet; then
            echo "Nada mudou."
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Teste fora da main: nao grava. Arquivos que entrariam no commit:"
            git diff --staged --stat
          else
            git commit -m "snd: coleta $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; [ $i = 5 ] && exit 1; sleep $((i*10)); done
          fi
