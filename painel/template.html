/* ── maiores movimentos ─────────────────────────────────────────────── */
const N_MOV = 12;
const ROT_JANELA = {d_spread_1d:"no dia", d_spread_5d:"em 5 pregões", d_spread_21d:"em 21 pregões"};

function linhaMov(p, i, escala, j){
  const v = p[j], neg = v < 0;
  const w = escala ? Math.max(4, Math.abs(v)/escala*100) : 0;
  const cor = neg ? "var(--fecha)" : "var(--abre)";
  const dpu = p.d_pu_1d_pct;
  return `<div class="mov-row" data-i="${D.papeis.indexOf(p)}">
    <span class="mov-rk">${i+1}</span>
    <span class="mov-id">
      <b><span class="dot" style="background:${CORF[p.familia]||"var(--neutro)"}"></span>${esc(p.codigo)}</b>
      <span title="${esc(p.emissor)}">${esc(p.emissor)}</span>
    </span>
    <span class="mov-tx" title="taxa de emissão">${taxaEmissao(p,true)}</span>
    <span class="mov-tx mov-tx-hoje" title="taxa indicativa ANBIMA de hoje">${taxaCotada(p,true)}</span>
    <span class="mov-sp" title="spread de mercado hoje: ${f0(p.spread_bps)} bps sobre ${esc(p.benchmark||"")}">${f0(p.spread_bps)}</span>
    <span class="mov-d">
      <b style="color:${cor}">${sgn(v)}</b>
      <span class="mov-bar"><i style="width:${w.toFixed(0)}%; background:${cor};
        ${neg?"margin-left:auto":""}"></i></span>
    </span>
  </div>`;
}

function movimentos(){
  const j = estado.janela;
  const base = D.papeis.filter(p =>
    p[j] != null && (estado.movIliq || (p.liquidez ?? 0) >= 45));

  const abriram  = base.filter(p=>p[j] > 0).sort((a,b)=>b[j]-a[j]).slice(0,N_MOV);
  const fecharam = base.filter(p=>p[j] < 0).sort((a,b)=>a[j]-b[j]).slice(0,N_MOV);
  // mesma escala nos dois lados: a comparação entre pontas tem que ser honesta
  const escala = Math.max(
    ...abriram.map(p=>Math.abs(p[j])), ...fecharam.map(p=>Math.abs(p[j])), 1);

  const rotD = {d_spread_1d:"Δ dia", d_spread_5d:"Δ 5 pregões", d_spread_21d:"Δ 21 pregões"}[j];
  const col = (titulo, cor, lista, vazio) => `<div class="mov-col">
    <div class="mov-cab">
      <h3><span class="dot" style="background:${cor}"></span>${titulo}</h3>
      <span class="n">${lista.length ? lista.length + " papéis" : ""}</span>
    </div>
    ${lista.length ? `<div class="mov-head"><span></span><span>papel</span>
        <span title="taxa da emissão">emissão</span>
        <span title="taxa indicativa ANBIMA de hoje">taxa hoje</span>
        <span title="spread de mercado hoje, em bps sobre o benchmark do indexador">spread</span>
        <span>${rotD}</span></div>`
      + lista.map((p,i)=>linhaMov(p,i,escala,j)).join("")
      : `<p class="mov-vazio">${vazio}</p>`}
  </div>`;

  document.getElementById("movs").innerHTML =
      col(`Abriram spread ${ROT_JANELA[j]}`,  "var(--abre)",  abriram,
          "Nenhum papel abriu spread nesta janela.")
    + col(`Fecharam spread ${ROT_JANELA[j]}`, "var(--fecha)", fecharam,
          "Nenhum papel fechou spread nesta janela.");
}

function filtrar(){
  const q=estado.q.trim().toLowerCase();
  return D.papeis.filter(p=>{
    if(estado.fam && p.familia!==estado.fam) return false;
    if(estado.bucket && p.bucket!==estado.bucket) return false;
    if(estado.liq && (p.liquidez==null || p.liquidez<estado.liq)) return false;
    if(estado.acao==="queda"   && !p.acao_tom) return false;
    if(estado.acao==="listado" && !p.acao_ticker) return false;
    if(estado.acao==="sem"     && p.acao_ticker) return false;
    if(estado.sinal==="__qualquer__"){ if(!(p.sinais||[]).length) return false; }
    else if(estado.sinal && !(p.sinais||[]).some(s=>s.tipo===estado.sinal)) return false;
    if(q && !(p.codigo.toLowerCase().includes(q) || (p.emissor||"").toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>{
    const k=estado.ord; let x=a[k], y=b[k];
    if(k==="sinais"){ x=(a.sinais||[]).length; y=(b.sinais||[]).length; }
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==="string") return estado.dir*x.localeCompare(y,"pt-BR");
    return estado.dir*(x-y);
  });
}

function tabela(){
  const linhas=filtrar();
  const cab=COLUNAS.map(c=>{
    const at = estado.ord===c.k ? ` aria-sort="${estado.dir===1?"ascending":"descending"}"` : "";
    const seta = estado.ord===c.k ? (estado.dir===1?" ↑":" ↓") : "";
    return `<th role="button" tabindex="0" data-k="${c.k}"${c.l?' class="l"':""}${at}>${c.r}${seta}</th>`;
  }).join("");
  const corpo = linhas.length
    ? linhas.slice(0,400).map(p=>`<tr>`+COLUNAS.map(c=>`<td${c.l?' class="l"':""}>${c.v(p)}</td>`).join("")+`</tr>`).join("")
    : "";
  document.getElementById("tabela").innerHTML = linhas.length
    ? `<div class="tw"><table><thead><tr>${cab}</tr></thead><tbody>${corpo}</tbody></table></div>`
      + (linhas.length>400 ? `<p class="note" style="margin-top:10px">Mostrando 400 de ${linhas.length} papéis. Refine os filtros para ver o resto.</p>` : "")
    : `<div class="tw"><p class="empty">Nenhum papel atende a esses filtros.</p></div>`;
  document.getElementById("cont").textContent = `${linhas.length} de ${D.papeis.length} papéis`;
}

  // interações
  const liga=(id,campo,num)=>document.getElementById(id)?.addEventListener("change",e=>{
    estado[campo]= num ? +e.target.value : e.target.value; tabela();});
  liga("fSinal","sinal"); liga("fFam","fam"); liga("fBucket","bucket"); liga("fLiq","liq",true);
  liga("fAcao","acao");
  let t; document.getElementById("fQ").addEventListener("input",e=>{
    clearTimeout(t); t=setTimeout(()=>{estado.q=e.target.value; tabela();},140);});

  const gp=document.getElementById("periodo");
  gp.addEventListener("click",e=>{
    const b=e.target.closest("button[data-j]"); if(!b) return;
    estado.janela=b.dataset.j;
    gp.querySelectorAll("button").forEach(x=>
      x.setAttribute("aria-pressed", x===b ? "true" : "false"));
    movimentos();
  });
  document.getElementById("movIliq").addEventListener("change",e=>{
    estado.movIliq=e.target.checked; movimentos();});

  // A tabela do universo nasce fechada: são 1.200 papéis e quem chega ao painel
  // quer primeiro a triagem e os gráficos. O contador ao lado do botão continua
  // vivo mesmo fechada, senão não dá para saber o que os filtros deixaram.
  const ut=document.getElementById("uniToggle"), uc=document.getElementById("uniCorpo");
  if (ut && uc) ut.addEventListener("click",()=>{
    const abrir = ut.getAttribute("aria-expanded") !== "true";
    ut.setAttribute("aria-expanded", abrir ? "true" : "false");
    ut.textContent = abrir ? "fechar tabela" : "abrir tabela";
    uc.hidden = !abrir;
    if (abrir) document.getElementById("fQ")?.focus({preventScroll:true});
  });

  const dj=document.getElementById("desJanela");
  if (dj) dj.addEventListener("click",e=>{
    const b=e.target.closest("button[data-dj]"); if(!b) return;
    estado.desloc=b.dataset.dj;
    dj.querySelectorAll("button").forEach(x=>
      x.setAttribute("aria-pressed", x===b ? "true" : "false"));
    renderDesloc();
  });

  const rv=document.getElementById("ratView");
  if (rv) rv.addEventListener("click",e=>{
    const b=e.target.closest("button[data-rv]"); if(!b) return;
    estado.ratView=b.dataset.rv;
    rv.querySelectorAll("button").forEach(x=>
      x.setAttribute("aria-pressed", x===b ? "true" : "false"));
    listaRatings();
  });


  FAMS_EMISSAO.forEach(({f})=>{
    const te=document.querySelector(`[data-tabemis="${f}"]`);
    if (!te) return;
    const ordenarE = k => {
      if (estado.ordE[f]===k) estado.dirE[f]*=-1;
      else { estado.ordE[f]=k; estado.dirE[f] = k==="codigo" ? 1 : -1; }
      linhasEmissao(f);
    };
    te.addEventListener("click",e=>{
      const th=e.target.closest("th[data-ke]"); if(th) ordenarE(th.dataset.ke);});
    te.addEventListener("keydown",e=>{
      const th=e.target.closest("th[data-ke]");
      if(th && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); ordenarE(th.dataset.ke);} });
  });

  const td=document.getElementById("tabDesloc");
  if (td){
    const ordenarD = k => {
      if (estado.ordD===k) estado.dirD*=-1;
      else { estado.ordD=k; estado.dirD = k==="codigo" ? 1 : -1; }
      linhasDesloc();
    };
    td.addEventListener("click",e=>{
      const th=e.target.closest("th[data-kd]"); if(th) ordenarD(th.dataset.kd);});
    td.addEventListener("keydown",e=>{
      const th=e.target.closest("th[data-kd]");
      if(th && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); ordenarD(th.dataset.kd);} });
  }

  document.getElementById("tabela").addEventListener("click",e=>{
    const th=e.target.closest("th[data-k]"); if(!th) return; ordenar(th.dataset.k);});
  document.getElementById("tabela").addEventListener("keydown",e=>{
    const th=e.target.closest("th[data-k]"); if(!th||(e.key!=="Enter"&&e.key!==" ")) return;
    e.preventDefault(); ordenar(th.dataset.k);});
  function ordenar(k){
    if(estado.ord===k) estado.dir*=-1;
    else {estado.ord=k; estado.dir = k==="codigo" ? 1 : -1;}
    tabela();
  }

  // tooltips dos gráficos
  document.addEventListener("mousemove",e=>{
    const sd=e.target.closest?.("svg[data-desloc]");
    if(sd){ hoverDesloc(sd, e); return; }
    limparAtivoDesloc();
    const pcc=e.target.closest?.("[data-cc]");  // CRI/CRA: pontos e linhas
    if(pcc && CC[+pcc.dataset.cc]){ mostrarTip(tipCC(CC[+pcc.dataset.cc]), e); return; }
    const pt=e.target.closest?.("[data-i]");   // pontos do gráfico e linhas de movimento
    if(pt){ mostrarTip(tipPapel(D.papeis[+pt.dataset.i]), e); return; }
    const fx=e.target.closest?.("[data-ev]");
    if(fx){ mostrarTip(fx.dataset.ev, e); return; }
    esconderTip();
  });

  listaRatings();
  initCriCra();
  initParalelo();
  if (document.getElementById("tabDesloc")) renderDesloc();
  FAMS_EMISSAO.forEach(({f})=>{ if (document.querySelector(`[data-tabemis="${f}"]`)) linhasEmissao(f); });
  movimentos();
  tabela();
}

montar();
</script>
